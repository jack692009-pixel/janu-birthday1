<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Janu ❤️</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

text-align:center;

font-family:Arial,sans-serif;

color:white;

background:
linear-gradient(
135deg,
#16000d,
#68003d,
#ff2f92
);

overflow:hidden;
}

.container{
width:90%;
max-width:500px;
}

h1{
font-size:40px;
}

p{
font-size:20px;
line-height:1.6;
}

.date{
margin-top:30px;
font-size:28px;
font-weight:bold;
}

.heart{
font-size:75px;
animation:beat 1s infinite;
}

@keyframes beat{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.2);
}

}

</style>

</head>

<body>

<div class="container">

<div class="heart">
❤️
</div>

<h1>
Thank You Janu ❤️
</h1>

<p>
माझा दिवस special केल्याबद्दल
<br>
Thank You So Much 🥹❤️
</p>

<div class="date">
17 October ला भेटूया ❤️
</div>

</div>

</body>

</html>
