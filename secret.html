<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Question ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
    color: white;
    text-align: center;

    background: linear-gradient(
        135deg,
        #16000d,
        #68003d,
        #ff2f92
    );

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
}

h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

.question {
    font-size: 21px;
    margin: 25px 0;
    line-height: 1.5;
}


/* OPTIONS */

.option {
    width: 100%;
    padding: 20px;
    margin: 14px 0;

    border-radius: 22px;

    background: rgba(255,255,255,0.12);

    border: 2px solid rgba(255,255,255,0.35);

    color: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;

    backdrop-filter: blur(10px);
}

.option:hover {
    transform: scale(1.04);

    background: rgba(255,255,255,0.25);

    box-shadow: 0 0 25px rgba(255,255,255,0.25);
}


/* SELECTED OPTION */

.option.selected {

    background: white;

    color: #d41468;

    border-color: white;

    transform: scale(1.04);

    box-shadow: 0 0 25px rgba(255,255,255,0.5);
}


/* HIDE RADIO */

.option input {
    display: none;
}


button {

    margin-top: 20px;

    padding: 15px 35px;

    border: none;

    border-radius: 30px;

    background: white;

    color: #d41468;

    font-weight: bold;

    font-size: 17px;

    cursor: pointer;

    box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

button:hover {

    transform: scale(1.05);

}


/* WRONG MESSAGE */

.wrong {

    margin-top: 20px;

    font-size: 18px;

    color: #ffd1e8;

}

</style>

</head>


<body>


<div class="container">


<h1>
🔐 Secret Question ❤️
</h1>


<div class="question">

Aamhi first time kuthe bhetlo hoto? 🥹❤️

</div>


<form method="POST">


<label class="option" onclick="selectOption(this)">

<input
type="radio"
name="answer"
value="Village"
required
>

🌳 Village

</label>


<label class="option" onclick="selectOption(this)">

<input
type="radio"
name="answer"
value="Mumbai"
>

🌆 Mumbai

</label>


<label class="option" onclick="selectOption(this)">

<input
type="radio"
name="answer"
value="Birthday"
>

🎂 Birthday

</label>


<label class="option" onclick="selectOption(this)">

<input
type="radio"
name="answer"
value="Wedding"
>

💍 Wedding

</label>


<button type="submit">

Answer ❤️

</button>


</form>


{% if wrong %}

<div class="wrong">

😜 Nooo! Wrong answer!  
<br>
पुन्हा try कर Janu ❤️

</div>

{% endif %}


</div>


<script>

function selectOption(element) {

    document.querySelectorAll(".option").forEach(function(option) {

        option.classList.remove("selected");

    });

    element.classList.add("selected");

}

</script>


</body>

</html>
